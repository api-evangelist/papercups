    type: AsyncAPI
  - url: https://github.com/papercups-io/papercups
    type: GitHub
  description: >-
    Bidirectional realtime live chat over Phoenix WebSocket channels. Clients join conversation, conversation-lobby,
    and account-room channels and exchange shout (message), messages:seen, and presence events for two-way
    messaging.
